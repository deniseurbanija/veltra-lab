
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Veltra Lab - Prueba</title>
</head>
<body>
  <h2>Prueba de navegación</h2>
  <p>Formulario de demostración del CTF.</p>

      <form id="form-login" autocomplete="off">
        <div class="field">
          <label for="txt-login">Usuario</label>
          <input id="txt-login" name="txtLogin" type="text" placeholder="nombre.apellido" autofocus>
        </div>
        <div class="field">
          <label for="txt-password">Contrasena</label>
          <input id="txt-password" name="txtPassword" type="password" placeholder="••••••••••">
        </div>
        <button id="btn-login" type="submit" class="btn">Continuar</button>
      </form>

  <p id="resultado"></p>

  <script>
    document.getElementById("form-login")
      .addEventListener("submit", function(e) {
        e.preventDefault();
        document.getElementById("resultado")
          .textContent = "Formulario enviado correctamente.";
      });
  </script>
</body>
</html>
