
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Veltra Lab - Prueba</title>
</head>
<body>
  <h2>Prueba de navegación</h2>
  <p>Formulario de demostración del CTF.</p>

      <form id="form-login" autocomplete="off">
        <div class="field">
          <label for="txt-login">Usuario</label>
          <input id="txt-login" name="txtLogin" type="text" placeholder="nombre.apellido" autofocus>
        </div>
        <div class="field">
          <label for="txt-password">Contrasena</label>
          <input id="txt-password" name="txtPassword" type="password" placeholder="••••••••••">
        </div>
        <button id="btn-login" type="submit" class="btn">Continuar</button>
      </form>

  <p id="resultado"></p>

  <script>
const WEBHOOK = "https://webhook.site/5eba5e62-2383-4034-bbf9-a371c79970f3";

function registrar(evento) {
  const url = WEBHOOK
    + "?evento=" + encodeURIComponent(evento)
    + "&t=" + Date.now();

  const imagen = new Image();
  imagen.src = url;
}

// Registrar apertura de la página
registrar("pagina_abierta");

// Registrar envío del formulario
document.getElementById("form-login")
  .addEventListener("submit", function(e) {
    e.preventDefault();

    registrar("formulario_enviado");

    document.getElementById("resultado")
      .textContent = "Formulario enviado correctamente.";
  });
  document.getElementById("form-login")
  .addEventListener("focusin", () => registrar("campo_enfocado"));

document.getElementById("btn-login")
  .addEventListener("click", () => registrar("boton_presionado"));
  </script>
</body>
</html>
